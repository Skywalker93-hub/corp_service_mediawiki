all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519

  children:
    vpn:
      hosts:
        openvpn:
          ansible_host: 203.0.113.10 # Replace with OpenVPN Elastic IP output from Terraform

    proxy:
      hosts:
        nginxproxy1:
          ansible_host: 10.10.2.7
        nginxproxy2:
          ansible_host: 10.10.3.5

    web:
      hosts:
        nginxweb1:
          ansible_host: 10.10.2.14
        nginxweb2:
          ansible_host: 10.10.3.14

    db:
      hosts:
        postgresql1:
          ansible_host: 10.10.2.11
        postgresql2:
          ansible_host: 10.10.3.10


